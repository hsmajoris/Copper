name: Update Copper Dashboard Data

on:
  schedule:
    # 22:00 UTC = 07:00 KST (Asia/Seoul, UTC+9)
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No FRED_API_KEY secret needed here (unlike the Gold dashboard this
      # project is based on) — real_rate (FRED DFII10) was dropped entirely,
      # and both dxy/fxi are free, unauthenticated Yahoo Finance tickers.
      - name: Fetch latest data
        run: python -m copper_dashboard.update_data

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: update copper dashboard data"
          git push
